<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    ul { padding: 0; list-style: none; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form id="add-form">
    <input id="title" placeholder="What needs doing?" required />
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    async function load() {
      const res = await fetch("/todos");
      const todos = await res.json();
      const ul = document.getElementById("list");
      ul.innerHTML = "";
      for (const t of todos) {
        const li = document.createElement("li");
        li.textContent = t.title;
        const del = document.createElement("button");
        del.textContent = "x";
        del.onclick = async () => { await fetch(`/todos/${t.id}`, { method: "DELETE" }); load(); };
        li.appendChild(del);
        ul.appendChild(li);
      }
    }
    document.getElementById("add-form").onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value;
      await fetch("/todos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
      document.getElementById("title").value = "";
      load();
    };
    load();
  </script>
</body>
</html>
